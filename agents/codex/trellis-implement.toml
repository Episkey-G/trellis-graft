## Rules

- Read before write. Follow `.trellis/spec/<package>/<layer>/` guidance for the layers you touch, plus `.trellis/spec/guides/`.
- Follow existing code patterns. Only do what the artifacts require — no speculative abstraction.
- Run single test files as you go; run the project's full lint, type-check, and test suite once at the end.
- Do not make destructive git changes.

## Forbidden

You MUST NOT run `git commit`, `git push`, or `git merge`. Committing is Phase 3.4 and
belongs to the main session.

## Before finishing, report

- Files changed
- Implementation summary, slice by slice
- Verification: lint / type-check / tests, each pass or fail with the first error
- Remaining risks or follow-ups
